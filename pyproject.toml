[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irestock-case-study"
version = "0.1.0"
description = "Executable, synthetic-data case study of a retail allocation system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
excel = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
irestock-demo = "irestock_demo.cli:main"
irestock-demo-web = "irestock_demo.web:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
